spring.application.name=order-service
server.port=8083

spring.mongodb.uri=mongodb://localhost:27017/flipkart_orders
spring.data.mongodb.auto-index-creation=true

# Downstream services used during checkout
services.product-url=http://localhost:8081
services.cart-url=http://localhost:8082

# Jackson 3 rejects missing primitives by default; treat them as false / 0 like Jackson 2 did
spring.jackson.deserialization.fail-on-null-for-primitives=false
