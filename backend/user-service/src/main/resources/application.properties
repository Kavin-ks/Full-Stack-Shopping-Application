spring.application.name=user-service
server.port=8084

spring.mongodb.uri=mongodb://localhost:27017/flipkart_users

# Shared with the API gateway, which verifies the tokens this service issues.
app.jwt.secret=oDdhFbkQogqu+BjE9xg8ryWz8k1WME9Xz8RBI7z6E3DVB0A2ip00iSFqSI5splzy
app.jwt.expiry-days=7

# No SMS/e-mail gateway in a local setup, so the OTP is returned to the UI and logged.
# Set to false when a real SMS provider is plugged in.
app.otp.expose-in-response=true

# Create the unique email / mobile indexes declared on User
spring.data.mongodb.auto-index-creation=true

# Jackson 3 rejects missing primitives by default; treat them as false / 0 like Jackson 2 did
spring.jackson.deserialization.fail-on-null-for-primitives=false
