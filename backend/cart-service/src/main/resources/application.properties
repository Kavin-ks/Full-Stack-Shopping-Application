spring.application.name=cart-service
server.port=8082

spring.mongodb.uri=mongodb://localhost:27017/flipkart_carts
spring.data.mongodb.auto-index-creation=true

# Cart items hold only product ids; live price / stock comes from product-service.
services.product-url=http://localhost:8081

# Jackson 3 rejects missing primitives by default; treat them as false / 0 like Jackson 2 did
spring.jackson.deserialization.fail-on-null-for-primitives=false
